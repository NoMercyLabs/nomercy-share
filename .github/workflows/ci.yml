name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    # A GitHub-hosted runner: this repo is public, so pull requests from forks never run on our own machines.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet format NoMercy.Share.sln --verify-no-changes
      - run: dotnet build NoMercy.Share.sln -c Release
      # The S3Mock tests skip without Linux Docker and the desktop-capture tests skip without an interactive desktop.
      - run: dotnet test NoMercy.Share.sln -c Release --no-build

  storage:
    # The S3Mock upload tests need Docker with Linux containers, which only the Linux runner has.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Fails when a test skips: here every S3Mock test must really run.
      - run: |
          set -o pipefail
          dotnet test tests/NoMercy.Share.Storage.S3.Tests -c Release | tee storage-tests.log
          grep -Eq "Skipped: +0," storage-tests.log

  host:
    # The Cloudflare Worker behind share.nomercy.tv: type check, strict lint and the router tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  extension:
    # The Edge and Chrome extension: type check, strict lint, tests and the bundle.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
